# rumdl — hard-wrap markdown prose at 80 columns, and nothing else.
#
# MD013 alone: the line-length rule, in reflow mode. `reflow-mode =
# "normalize"` re-fills every paragraph — the default mode
# only breaks lines already over the column and leaves a paragraph hand-wrapped
# narrower exactly as it is, so a doc wrapped at 60 would pass the check.
#
# `headings`, `code-blocks` and `tables` are off because rumdl cannot wrap
# them; left on they report lines no `fmt` pass can fix.
#
# Scope: `skills/`, `docs/`, `manual/` and root-level markdown. `plans/` and `memory/`
# stay out (frozen work, and a submodule with its own gate). The root-level
# pattern is `/*.md`, not `*.md`: an unanchored `*` crosses `/`, so `*.md`
# pulls in `plans/`, `memory/` and every other tree. `TASK.md` and `TODO.md`
# are handoff files, written by other tooling and left unwrapped.

[global]
enable = ["MD013"]
include = ["skills/**/*.md", "docs/**/*.md", "manual/**/*.md", "/*.md"]
exclude = ["/TASK.md", "/TODO.md"]

[MD013]
line-length = 80
reflow = true
reflow-mode = "normalize"
headings = false
code-blocks = false
tables = false
